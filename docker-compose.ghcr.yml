# ---------------------------------------------------------------------------
# abs-m4b-tagger — variante utilisant l'image pré-construite par GitHub Actions
#
# Aucune construction sur le NAS : Portainer se contente de tirer l'image.
# Le workflow .github/workflows/docker-publish.yml publie l'image sur GHCR
# à chaque push sur main et à chaque tag v*.
#
# Portainer > Stacks > Add stack > Repository
#   Compose path : docker-compose.ghcr.yml
#   Variable IMAGE : ghcr.io/<ton-compte>/abs-m4b-tagger:latest
# ---------------------------------------------------------------------------

services:
  abs-m4b-tagger:
    image: "${IMAGE:-ghcr.io/baloodusudouest/abs-m4b-tagger:latest}"
    container_name: abs-m4b-tagger
    restart: unless-stopped
    pull_policy: always

    user: "${PUID:-1026}:${PGID:-100}"

    environment:
      TZ: "${TZ:-Europe/Paris}"

      ABS_URL: "${ABS_URL:?ABS_URL est obligatoire}"
      ABS_TOKEN: "${ABS_TOKEN:?ABS_TOKEN est obligatoire}"
      ABS_VERIFY_SSL: "${ABS_VERIFY_SSL:-true}"

      PATH_MAP: "${PATH_MAP:-/audiobooks:/media/livres}"

      INTERVAL: "${INTERVAL:-3600}"
      DRY_RUN: "${DRY_RUN:-false}"
      FORCE: "${FORCE:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      STATE_FILE: "/config/state.json"
      ABS_LIBRARIES: "${ABS_LIBRARIES:-}"

      WRITE_COVER: "${WRITE_COVER:-true}"
      COVER_MAX_PX: "${COVER_MAX_PX:-1200}"
      STRIP_HTML: "${STRIP_HTML:-true}"
      WRITE_COMMENT: "${WRITE_COMMENT:-true}"
      TRACK_TITLE_MODE: "${TRACK_TITLE_MODE:-filename}"
      SYNC_CHAPTERS: "${SYNC_CHAPTERS:-false}"   # ffmpeg est inclus dans l'image
      WRITE_SIDECARS: "${WRITE_SIDECARS:-false}"

      INCOMPLETE_CHECKS: "${INCOMPLETE_CHECKS:-identifier,author,cover}"
      ON_INCOMPLETE: "${ON_INCOMPLETE:-tag}"
      INCOMPLETE_TAG: "${INCOMPLETE_TAG:-a-identifier}"
      REMOVE_TAG_WHEN_COMPLETE: "${REMOVE_TAG_WHEN_COMPLETE:-true}"
      TAG_INCOMPLETE_FILES: "${TAG_INCOMPLETE_FILES:-false}"

      ORPHAN_ACTION: "${ORPHAN_ACTION:-report}"
      ORPHAN_SCAN_DIRS: "${ORPHAN_SCAN_DIRS:-/media/livres}"
      ORPHAN_MIN_AGE_MIN: "${ORPHAN_MIN_AGE_MIN:-30}"
      UNMATCHED_DIR: "${UNMATCHED_DIR:-/media/a-trier}"

      # ---------------- Export des livres validés ----------------
      # Seuls les livres complets (non signalés par le triage) sont exportés.
      EXPORT_ACTION: "${EXPORT_ACTION:-hardlink}"          # none | copy | move | hardlink | symlink
      MOVE_CLEANUP_SOURCE: "${MOVE_CLEANUP_SOURCE:-true}"   # supprimer le dossier source vidé
      AFTER_MOVE: "${AFTER_MOVE:-keep}"               # keep | remove (retire l'item de la base ABS)
      EXPORT_DIR: "${EXPORT_DIR:-/media/AudioBooks/Audible}"
      EXPORT_DIR_TEMPLATE: "${EXPORT_DIR_TEMPLATE:-{auteur}/<{serie}/><{annee} - >{titre}<  [{serie} {serie_num}]>< {asin}>< [{region}]>}"
      EXPORT_FILE_TEMPLATE: "${EXPORT_FILE_TEMPLATE:-{titre}}"
      EXPORT_SIDECARS: "${EXPORT_SIDECARS:-cover,metadata,desc,reader}"
      EXPORT_REGION: "${EXPORT_REGION:-us}"            # code fixe, ou "auto" d'après la langue
      EXPORT_OVERWRITE: "${EXPORT_OVERWRITE:-false}"
      EXPORT_COLLAPSE_SPACES: "${EXPORT_COLLAPSE_SPACES:-false}"
      EXPORT_MAX_COMPONENT: "${EXPORT_MAX_COMPONENT:-180}"
      EXPORT_PRUNE_STALE: "${EXPORT_PRUNE_STALE:-true}"
      EXPORT_MAX_PATH: "${EXPORT_MAX_PATH:-255}"

      # ---------------- Nettoyage de la liste d'auteurs ----------------
      # Les métadonnées Audible françaises créditent souvent traducteurs et
      # narrateurs comme auteurs, dans un ordre variable : un même auteur se
      # retrouve alors réparti dans plusieurs dossiers.
      AUTHOR_EXCLUDE: "${AUTHOR_EXCLUDE:-traducteur,traductrice,traduction,narrateur,narratrice,lu par,adaptation,illustrateur,illustratrice,postface,préface}"
      AUTHOR_DROP_NARRATORS: "${AUTHOR_DROP_NARRATORS:-true}"
      AUTHOR_SORT: "${AUTHOR_SORT:-true}"
      TRUST_UPDATED_AT: "${TRUST_UPDATED_AT:-true}"

    volumes:
      - "${CONFIG_DIR:-/volume1/docker/abs-tagger/config}:/config"

      # IMPORTANT pour EXPORT_ACTION=hardlink : un SEUL montage parent, afin que
      # la source et la destination soient sur le même système de fichiers.
      # Adapte ensuite PATH_MAP, ORPHAN_SCAN_DIRS, EXPORT_DIR et UNMATCHED_DIR
      # pour qu'ils pointent tous sous /media.
      - "${MEDIA_DIR:-/volume1/media}:/media"
