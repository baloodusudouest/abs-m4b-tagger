# ---------------------------------------------------------------------------
# abs-m4b-tagger — stack Portainer déployée depuis GitHub
#
# Portainer > Stacks > Add stack > Repository
#   Repository URL : https://github.com/<TON-COMPTE>/abs-m4b-tagger
#   Compose path   : docker-compose.yml
#   Environment variables : renseigner au minimum ABS_URL, ABS_TOKEN, PATH_MAP
#
# L'image est construite par Portainer à partir du Dockerfile du dépôt.
# Pour utiliser une image pré-construite (GHCR), voir docker-compose.ghcr.yml
# ---------------------------------------------------------------------------

services:
  abs-m4b-tagger:
    build:
      context: .
      dockerfile: Dockerfile
    image: abs-m4b-tagger:local
    container_name: abs-m4b-tagger
    restart: unless-stopped

    # UID:GID autorisé à écrire dans la bibliothèque (Synology : `id mon_user`)
    user: "${PUID:-1026}:${PGID:-100}"

    environment:
      TZ: "${TZ:-Europe/Paris}"

      # ---------------- Connexion Audiobookshelf ----------------
      ABS_URL: "${ABS_URL:?ABS_URL est obligatoire}"
      ABS_TOKEN: "${ABS_TOKEN:?ABS_TOKEN est obligatoire}"
      ABS_VERIFY_SSL: "${ABS_VERIFY_SSL:-true}"

      # ---------------- Correspondance des chemins ----------------
      # <chemin vu par Audiobookshelf>:<chemin monté ici>
      PATH_MAP: "${PATH_MAP:-/audiobooks:/livres}"

      # ---------------- Fonctionnement ----------------
      INTERVAL: "${INTERVAL:-3600}"
      DRY_RUN: "${DRY_RUN:-false}"
      FORCE: "${FORCE:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      STATE_FILE: "/config/state.json"
      ABS_LIBRARIES: "${ABS_LIBRARIES:-}"

      # ---------------- Tags écrits dans les fichiers ----------------
      WRITE_COVER: "${WRITE_COVER:-true}"
      COVER_MAX_PX: "${COVER_MAX_PX:-1200}"
      STRIP_HTML: "${STRIP_HTML:-true}"
      WRITE_COMMENT: "${WRITE_COMMENT:-true}"
      TRACK_TITLE_MODE: "${TRACK_TITLE_MODE:-filename}"
      SYNC_CHAPTERS: "${SYNC_CHAPTERS:-false}"
      WRITE_SIDECARS: "${WRITE_SIDECARS:-false}"

      # ---------------- Livres présents dans ABS mais non identifiés ----------------
      INCOMPLETE_CHECKS: "${INCOMPLETE_CHECKS:-identifier,author,cover}"
      ON_INCOMPLETE: "${ON_INCOMPLETE:-tag}"
      INCOMPLETE_TAG: "${INCOMPLETE_TAG:-a-identifier}"
      REMOVE_TAG_WHEN_COMPLETE: "${REMOVE_TAG_WHEN_COMPLETE:-true}"
      TAG_INCOMPLETE_FILES: "${TAG_INCOMPLETE_FILES:-false}"

      # ---------------- Fichiers sur le disque absents d'ABS ----------------
      ORPHAN_ACTION: "${ORPHAN_ACTION:-report}"
      ORPHAN_SCAN_DIRS: "${ORPHAN_SCAN_DIRS:-/livres}"
      ORPHAN_MIN_AGE_MIN: "${ORPHAN_MIN_AGE_MIN:-30}"
      UNMATCHED_DIR: "${UNMATCHED_DIR:-/a-trier}"

    volumes:
      - "${CONFIG_DIR:-/volume1/docker/abs-tagger/config}:/config"
      - "${LIBRARY_DIR:-/volume1/media/livres}:/livres"
      - "${TRIAGE_DIR:-/volume1/media/a-trier}:/a-trier"
